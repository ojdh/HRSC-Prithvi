<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6f2df">
<title>Offline · Prithvi FC</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: light; --ground: #e6f2df; --ink: #12150e; --muted: #4a5443; --lime: #c5f45b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--ground); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { display: grid; gap: 14px; justify-items: center; max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 0; font-size: 26px; line-height: 1.15; }
  p { margin: 0; color: var(--muted); }
  button { font: inherit; font-weight: 700; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--lime); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Prithvi FC needs a connection for scores, votes and chat. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
